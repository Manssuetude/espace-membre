name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - front
      - back

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manssu_frontend-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manssu_frontend-main/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build (includes typecheck)
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manssu_backend-main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: manssu_backend-main/requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q app
